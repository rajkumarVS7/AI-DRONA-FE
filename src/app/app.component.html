<!-- Main Application Top Bar -->
<header class="h-14 bg-slate-900 text-white flex items-center justify-between px-6 shadow-md">
  <div class="flex items-center space-x-3">
    <span class="text-xl font-bold tracking-wider text-indigo-400">🤖 AI-Drona</span>
    <span class="bg-indigo-950 text-indigo-300 text-xs px-2 py-0.5 rounded-full border border-indigo-700 font-mono">Prototype v1.0</span>
  </div>
  <div class="text-sm text-slate-400">Status: <span class="text-emerald-400 font-medium">● Connected</span></div>
</header>

<!-- Three Pane Workspace Layout Dashboard Matrix -->
<main class="flex h-[calc(100vh-3.5rem)] w-full overflow-hidden bg-slate-50">
  
  <!-- Left Panel: Content Source Ingestion Space -->
  <section class="w-1/4 min-w-[280px] max-w-sm bg-white border-r border-slate-200 p-4 overflow-y-auto">
    <app-source-ingestion></app-source-ingestion>
  </section>

  <!-- Center Panel: Live Smart Notebook Viewer Workspace Canvas -->
  <section class="w-2/5 flex-1 bg-slate-50 border-r border-slate-200 p-6 overflow-y-auto">
    <app-workspace-notes></app-workspace-notes>
  </section>

  <!-- Right Panel: Contextual Interrogative AI Copilot Chat Stream -->
  <section class="w-1/3 min-w-[350px] max-w-xl bg-white flex flex-col h-full">
    <app-ai-copilot></app-ai-copilot>
  </section>

</main>
